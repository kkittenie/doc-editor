<p>Pada hari [Hari], tanggal [Tanggal], bertempat di [Tempat], telah dibuat dan ditandatangani Perjanjian Kerja Sama Berlangganan Jasa Metro Fiber Optik (selanjutnya disebut “Perjanjian”), oleh dan antara:</p>
<p>PT Bina Informatika Solusi, berkedudukan di Jalan Prakarsa Muda Nomor 258, Kel. Pekiringan, Kec. Kesambi, Kota Cirebon, Jawa Barat 45131. Berdasarkan Akta Berita Acara RUPS Tahunan Perseroan Terbatas “PT Bina Informatika Solusi”, Nomor 5, tanggal 10 Juli 2026, dibuat dihadapan Irni Yuniati, S.H., M.Kn., Notaris di Kota Cimahi. Dalam hal ini diwakili oleh Ageng Bagja Priyadi, S.T., M.Kom., selaku Direktur, sah bertindak untuk dan atas nama PT Bina Informatika Solusi, selanjutnya disebut “<strong>PIHAK PERTAMA</strong>”</p>
<p>[<strong>PIHAK KEDUA</strong>], berkedudukan di Jl. Cetarip Barat (Cetarip Raya) No. 15/200 Rt/Rw 05/10, Kopo, Kota Bandung. Berdasarkan Risalah Rapat PT. Dinar Wahana Gemilang Nomor 16 Tanggal 12 Desember 2022, dibuat dihadapan Arief Karisma, S.H., M.Kn Notaris di Kabupaten Bandung. Dalam hal ini diwakili oleh Wildan Arief Santika Budi, selaku Direktur, sah bertindak untuk dan atas nama [<strong>PIHAK KEDUA</strong>], selanjutnya disebut “<strong>PIHAK KEDUA</strong>”</p>
<p><strong>PIHAK PERTAMA</strong> dan <strong>PIHAK KEDUA</strong> secara bersama-sama selanjutnya disebut “<strong>PARA PIHAK</strong>”</p>
<p><strong>PARA PIHAK</strong> dengan ini menerangkan telah sepakat untuk mengikatkan diri pada syarat-syarat dan ketentuan-ketentuan sebagai berikut:</p>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 1</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>DEFINISI</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1">“Perjanjian” adalah Kontrak Payung ini berikut seluruh Lampiran Berlangganan Jasa, Service Order Form, Service Upgrade/Downgrade Form, Berita Acara, Addendum dan/atau Amandemen yang merupakan satu kesatuan yang tidak terpisahkan.</li><li value="2">“Jasa” adalah layanan yang disediakan oleh <strong>PIHAK PERTAMA</strong> kepada <strong>PIHAK KEDUA</strong> sebagaimana tercantum dalam setiap Lampiran Berlangganan Jasa.</li><li value="3">“Metro Fiber Optik” adalah layanan konektivitas jaringan privat berbasis fiber optik berkecepatan tinggi menggunakan teknologi Metro Ethernet yang menghubungkan satu atau lebih lokasi <strong>PIHAK KEDUA</strong> secara aman dan stabil dengan kapasitas besar (Gbps), Quality of Service (QoS) terjamin, fleksibilitas Point-to-Point dan/atau Multipoint, serta keandalan tinggi untuk kebutuhan bisnis dan aplikasi real-time.</li><li value="4">“Biaya Jasa” adalah biaya yang wajib dibayarkan oleh <strong>PIHAK KEDUA</strong> kepada <strong>PIHAK PERTAMA</strong> atas penggunaan Jasa sebagaimana tercantum dalam masing-masing Lampiran Berlangganan Jasa.</li><li value="5">“Service Order Form” adalah formulir permohonan berlangganan Jasa yang diajukan oleh <strong>PIHAK KEDUA</strong> kepada <strong>PIHAK PERTAMA</strong>.</li><li value="6">“Service Upgrade/Downgrade Form” adalah formulir permohonan perubahan kapasitas layanan yang diajukan oleh <strong>PIHAK KEDUA</strong> kepada <strong>PIHAK PERTAMA</strong>.</li><li value="7">“Lampiran Berlangganan Jasa” adalah dokumen yang memuat rincian teknis dan komersial setiap lokasi layanan termasuk bandwidth, rute koneksi, biaya layanan, biaya instalasi, serta masa berlaku.</li><li value="8">“Berita Acara” adalah dokumen serah terima aktivasi, pemasangan, upgrade, downgrade, atau penyelesaian pekerjaan yang ditandatangani <strong>PARA PIHAK</strong>.</li><li value="9">“Isolir” adalah penghentian sementara layanan oleh <strong>PIHAK PERTAMA</strong> akibat tidak dipenuhinya kewajiban pembayaran atau kewajiban lainnya oleh <strong>PIHAK KEDUA</strong>.</li><li value="10">“Hari Kerja” adalah hari selain hari Minggu dan hari libur nasional yang ditetapkan Pemerintah Republik Indonesia.</li><li value="11">“Pemberitahuan Tertulis” adalah komunikasi resmi <strong>PARA PIHAK</strong> melalui surat atau media elektronik.</li><li value="12">“SLA (Service Level Agreement)” adalah standar tingkat layanan minimum yang dijamin oleh <strong>PIHAK PERTAMA</strong> sebagaimana tercantum dalam Lampiran SLA.</li><li value="13">Apabila terdapat istilah yang belum diatur dalam Perjanjian ini, maka akan ditafsirkan sesuai ketentuan peraturan perundang-undangan yang berlaku.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 2</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>RUANG LINGKUP LAYANAN</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1"><strong>PARA PIHAK</strong> sepakat bahwa layanan Metro Fiber Optik dapat diberikan pada satu atau lebih lokasi <strong>PIHAK KEDUA</strong>;</li><li value="2">Setiap lokasi layanan dituangkan dalam Lampiran Berlangganan Jasa tersendiri yang memiliki kekuatan hukum yang sama dengan Perjanjian ini;</li><li value="3">Layanan Jasa yang disediakan <strong>PIHAK PERTAMA</strong> berdasarkan Perjanjian ini dapat digunakan oleh <strong>PIHAK KEDUA</strong> selama 24 jam/hari (7 hari/minggu);</li><li value="4">Penyediaan Fasilitas dan Jasa <strong>PIHAK PERTAMA</strong> akan dilakukan sesuai dengan konfigurasi teknis yang telah disepakati;</li><li value="5">Terminal, perangkat antarmuka, maupun perangkat lainnya milik <strong>PIHAK KEDUA</strong> yang akan dihubungkan dengan jaringan <strong>PIHAK PERTAMA</strong> wajib memenuhi spesifikasi teknis yang ditetapkan oleh <strong>PIHAK PERTAMA</strong> dan memperoleh persetujuan terlebih dahulu. <strong>PIHAK PERTAMA</strong> berhak menolak perangkat yang berpotensi mengganggu keamanan, stabilitas, atau kinerja jaringan;</li><li value="6">Penambahan, pengurangan, perubahan, maupun pengakhiran layanan pada suatu lokasi tidak memerlukan perubahan terhadap Kontrak Payung ini dan cukup dilakukan melalui penerbitan, perubahan, atau pengakhiran Lampiran Berlangganan Jasa yang disepakati <strong>PARA PIHAK</strong>. Pengakhiran satu Lampiran tidak mengakhiri keberlakuan Perjanjian ini maupun Lampiran lainnya yang masih berlaku.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 3</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>AKTIVASI LAYANAN</strong></p>
<p>Aktivasi setiap Layanan akan dimulai setelah Fasilitas <strong>PIHAK PERTAMA</strong> siap dioperasikan dan dinyatakan dengan Berita Acara yang telah ditandatangani oleh <strong>PARA PIHAK</strong>.</p>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 4</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>JANGKA WAKTU BERLANGGANAN</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1">Jangka waktu berlangganan setiap layanan Metro Fiber Optik adalah minimal 1 (satu) tahun terhitung sejak tanggal aktivasi layanan yang dibuktikan dengan Berita Acara yang ditandatangani <strong>PARA PIHAK</strong> untuk masing-masing Lampiran Berlangganan Jasa;</li><li value="2">Apabila <strong>PIHAK KEDUA</strong>  mengakhiri Layanan sebelum Jangka Waktu berakhir sebagaimana dimaksud dalam ayat 1 (satu) Pasal ini, maka <strong>PIHAK KEDUA</strong> akan dikenakan denda sebagaimana berikut:</li></ol>
<table class="contract-table-bordered" style="border-collapse:collapse; table-layout:fixed; width:100%; margin:5pt 0;" data-flow-atomic="1"><tbody><tr><td style="border:1px solid #000; padding:3pt 4pt; vertical-align:top; font-size:9pt; line-height:1.15; word-break:break-word; overflow-wrap:anywhere; width:100%;">100% x Biaya Bulanan x Bulan yang belum terpenuhi</td></tr></tbody></table>
<ol start="3" class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="3">Apabila 30 (Tiga puluh) hari sebelum jangka waktu dalam pasal  4 ayat 1 ini berakhir <strong>PIHAK KEDUA</strong> tidak melakukan pemberitahuan tertulis pengakhiran Layanan, maka Syarat dan Ketentuan Berlangganan akan otomatis berlanjut selama 1 (Satu) tahun (“Jangka Waktu Perpanjangan”);</li><li value="4">Perpanjangan atau pengakhiran pada satu Lampiran Berlangganan Jasa tidak mempengaruhi keberlakuan Lampiran lainnya yang masih aktif.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 5</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>PEMBAYARAN</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1"><strong>PIHAK KEDUA</strong> wajib melakukan pembayaran atas seluruh layanan Metro Fiber Optik yang digunakan sesuai dengan masing-masing Lampiran Berlangganan Jasa;</li><li value="2" style="page-break-before:always;">Pembayaran dilakukan oleh <strong>PIHAK KEDUA</strong> selambat–lambatnya pada tanggal sesuai dengan invoice yang diterbitkan atau selambat-lambatnya 7 (tujuh) hari dari tanggal invoice diterbitkan. Tidak diterimanya invoice oleh <strong>PIHAK KEDUA</strong> tidak menghapus kewajiban pembayaran sepanjang tagihan tersebut telah diterbitkan oleh <strong>PIHAK PERTAMA</strong>;</li><li value="3">Atas setiap keterlambatan pembayaran dari tanggal sebagaimana dimaksud pada ayat (2), maka <strong>PIHAK KEDUA</strong> dikenakan denda keterlambatan pembayaran sebesar 1 (satu) permil setiap hari keterlambatan dari total tagihan yang belum dibayarkan;</li><li value="4">Apabila dalam 1 (satu) bulan <strong>PIHAK KEDUA</strong> belum memenuhi kewajibannya tersebut, maka <strong>PIHAK PERTAMA</strong> akan melakukan pemutusan sementara (isolir) terhadap satu atau seluruh layanan tanpa pemberitahuan terlebih dahulu kepada <strong>PIHAK KEDUA</strong>;</li><li value="5">Apabila <strong>PIHAK KEDUA</strong> melunasi biaya-biaya dalam pasal ini, maka <strong>PIHAK PERTAMA</strong> akan membuka pemutusan sementara (isolir) dalam waktu selambat-lambatnya 1 (satu) hari kerja;</li><li value="6">Seluruh biaya administrasi perbankan yang timbul dalam proses pembayaran menjadi tanggung jawab <strong>PIHAK KEDUA</strong>;</li><li value="7">Pajak-pajak yang timbul atas pelaksanaan Perjanjian ini menjadi tanggung jawab masing-masing Pihak berdasarkan peraturan perundang-undangan yang berlaku di Indonesia;</li><li value="8"><strong>PIHAK PERTAMA</strong> memiliki hak mengubah Biaya Instalasi atau Biaya Bulanan dengan pemberitahuan terlebih dahulu secara tertulis 30 <p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 6</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>HAK DAN KEWAJIBAN PIHAK PERTAMA</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1"><strong>PIHAK PERTAMA</strong> berkewajiban melakukan pemeliharaan dan/atau perbaikan atas kerusakan atau gangguan pada saluran, perangkat, dan/atau fasilitas milik <strong>PIHAK PERTAMA</strong> yang digunakan untuk penyelenggaraan Jasa;</li><li value="2">Dalam hal kerusakan atau gangguan sebagaimana dimaksud pada ayat (1) Pasal ini terbukti disebabkan oleh kesalahan, kesengajaan, dan/atau kelalaian <strong>PIHAK KEDUA</strong> dan/atau pihak yang berada di bawah tanggung jawab <strong>PIHAK KEDUA</strong>, maka <strong>PIHAK PERTAMA</strong> berhak membebankan biaya perbaikan dan/atau penggantian kepada <strong>PIHAK KEDUA</strong> sesuai perhitungan wajar <strong>PIHAK PERTAMA</strong>;</li><li value="3"><strong>PIHAK PERTAMA</strong> berhak memperoleh informasi yang diperlukan mengenai tujuan penggunaan Jasa oleh <strong>PIHAK KEDUA</strong> untuk memastikan penggunaan Jasa tidak bertentangan dengan ketentuan peraturan perundang-undangan yang berlaku di Republik Indonesia;</li><li value="4"><strong>PIHAK PERTAMA</strong> berhak menerima pembayaran atas Biaya Jasa dari <strong>PIHAK KEDUA</strong> sesuai dengan ketentuan dalam Perjanjian ini dan/atau Lampiran Berlangganan Jasa;</li><li value="5"><strong>PIHAK PERTAMA</strong> tidak bertanggung jawab atas isi, keakuratan, legalitas, integritas, kerahasiaan, kehilangan, kerusakan, maupun penyalahgunaan data, informasi, aplikasi, atau sistem milik <strong>PIHAK KEDUA</strong> yang ditransmisikan melalui layanan sepanjang berada di luar kendali wajar <strong>PIHAK PERTAMA</strong>;</li><li value="6"><strong>PIHAK PERTAMA</strong> tidak bertanggung jawab atas kerugian tidak langsung, kerugian konsekuensial, kehilangan keuntungan, kehilangan pendapatan, kehilangan peluang usaha, kehilangan data, atau kerugian lainnya yang timbul akibat penggunaan atau tidak dapat digunakannya layanan, kecuali apabila ker <p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 7</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>HAK DAN KEWAJIBAN PIHAK KEDUA</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1"><strong>PIHAK KEDUA</strong> berhak memperoleh dan menggunakan Jasa Metro Fiber Optik sesuai dengan Lampiran Berlangganan Jasa dan ketentuan peraturan perundang-undangan yang berlaku di Republik Indonesia;</li><li value="2"><strong>PIHAK KEDUA</strong> berkewajiban menyediakan perangkat, infrastruktur internal, izin, serta akses lokasi yang memenuhi standar teknis yang dipersyaratkan <strong>PIHAK PERTAMA</strong> agar instalasi dan aktivasi dapat dilakukan sesuai jadwal. Segala keterlambatan akibat tidak dipenuhinya kewajiban ini menjadi tanggung jawab <strong>PIHAK KEDUA</strong>;</li><li value="3"><strong>PIHAK KEDUA</strong> dilarang memberikan kesempatan kepada pihak ketiga untuk memanfaatkan Jasa <strong>PIHAK PERTAMA</strong> tanpa persetujuan tertulis terlebih dahulu dari <strong>PIHAK PERTAMA</strong>;</li><li value="4"><strong>PIHAK KEDUA</strong> dilarang melakukan perubahan terhadap spesifikasi teknis, konfigurasi, maupun fasilitas Jasa <strong>PIHAK PERTAMA</strong>, termasuk menghubungkan ke jaringan lain, kecuali dengan persetujuan tertulis dari <strong>PIHAK PERTAMA</strong>;</li><li value="5"><strong>PIHAK KEDUA</strong> dilarang menghubungkan jaringan dan/atau fasilitas <strong>PIHAK PERTAMA</strong> dengan jaringan telekomunikasi umum (PSTN) maupun jaringan lainnya tanpa izin tertulis dari <strong>PIHAK PERTAMA</strong>;</li><li value="6"><strong>PIHAK KEDUA</strong> wajib memberikan izin akses kepada <strong>PIHAK PERTAMA</strong> untuk memasuki lokasi <strong>PIHAK KEDUA</strong> sepanjang diperlukan untuk keperluan instalasi, pemeliharaan, perbaikan, dan pemeriksaan layanan;</li><li value="7"><strong>PIHAK KEDUA</strong> wajib melakukan pembayaran seluruh Biaya Jasa, termasuk denda keterlambatan dan biaya lain yang timbul sesuai Perjanjian ini dan Lampiran Berlangganan Jasa;</li><li value="8"><strong>PIHAK KEDUA</strong> berhak memperoleh kompensasi atas gangguan layanan yang terbukti secara langsung disebabkan oleh <strong>PIHAK PERTAMA</strong> dan tidak termasuk kondisi force majeure, gangguan pihak ketiga, atau kelalaian <strong>PIHAK KEDUA</strong>, sesuai ketentuan SLA;</li><li value="9">Hak dan kewajiban <strong>PIHAK KEDUA</strong> sebagaimana dimaksud dalam Pasal ini berlaku untuk seluruh layanan, kapasitas, lokasi, dan Lampiran Berlangganan Jasa yang masih aktif maupun yang akan diterbitkan di kemudian hari.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 8</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>PEMBATALAN</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1">Dalam hal <strong>PIHAK KEDUA</strong> membatalkan salah satu atau seluruh layanan yang telah disepakati dalam Service Order Form dan/atau Lampiran Berlangganan Jasa sebelum dan/atau sesudah dilakukan aktivasi sebagaimana dibuktikan dengan Berita Acara, maka <strong>PIHAK KEDUA</strong> tetap wajib melakukan pelunasan atas Biaya Instalasi untuk layanan yang dibatalkan tersebut.</li><li value="2">Pembatalan terhadap satu layanan pada satu Lampiran Berlangganan Jasa tidak mempengaruhi keberlakuan layanan pada Lampiran Berlangganan Jasa lainnya yang masih aktif.</li><li value="3">Ketentuan pembatalan ini tidak mengurangi hak <strong>PIHAK PERTAMA</strong> untuk menagih kewajiban <strong>PIHAK KEDUA</strong> lainnya yang telah timbul berdasarkan Perjanjian ini.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 9</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>PERPINDAHAN DAN PENGALIHAN</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1"><strong>PIHAK KEDUA</strong> dapat mengajukan permohonan perpindahan lokasi layanan. Permohonan tersebut akan dievaluasi oleh <strong>PIHAK PERTAMA</strong> berdasarkan hasil survei dan ketersediaan jaringan, kapasitas, serta pertimbangan teknis lainnya. <strong>PIHAK PERTAMA</strong> berhak menyetujui atau menolak permohonan tersebut apabila secara teknis tidak memungkinkan untuk dilaksanakan;</li><li value="2">Seluruh biaya yang timbul akibat perpindahan lokasi layanan, termasuk namun tidak terbatas pada biaya survei, instalasi, material, aktivasi, konfigurasi, penarikan kabel, pembangunan infrastruktur tambahan, dan biaya lainnya yang diperlukan, menjadi tanggung jawab <strong>PIHAK KEDUA</strong> sesuai penawaran atau ketentuan yang berlaku pada <strong>PIHAK PERTAMA</strong>;</li><li value="3">Pemindahan layanan atau fasilitas yang telah terpasang ke lokasi lain akan diperlakukan sebagai pemasangan atau sambungan baru, termasuk penerapan biaya instalasi dan ketentuan masa berlangganan baru, kecuali <strong>PARA PIHAK</strong> menyepakati lain secara tertulis.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 10</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>PEMUTUSAN PERJANJIAN</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1"><strong>PIHAK PERTAMA</strong> tidak bertanggung jawab atas gangguan, penurunan kualitas layanan, maupun pemutusan layanan yang disebabkan oleh kerusakan, kegagalan sistem, perangkat, jaringan internal, sumber daya listrik, konfigurasi, atau fasilitas lain yang berada di bawah penguasaan dan tanggung jawab <strong>PIHAK KEDUA</strong> maupun pihak ketiga yang ditunjuk oleh <strong>PIHAK KEDUA</strong>;</li><li value="2">Apabila pemutusan layanan terjadi akibat pelanggaran PERJANJIAN oleh <strong>PIHAK KEDUA</strong>, maka <strong>PIHAK KEDUA</strong> tetap berkewajiban melunasi seluruh tagihan yang telah jatuh tempo, biaya berlangganan untuk sisa masa kontrak, denda, penalti terminasi dini, serta kewajiban finansial lainnya yang timbul berdasarkan PERJANJIAN ini;</li><li value="3">Dalam hal salah satu pihak dinyatakan pailit berdasarkan putusan pengadilan yang berkekuatan hukum tetap, dibubarkan, dicabut izin usahanya oleh instansi yang berwenang, atau secara permanen menghentikan kegiatan usahanya, maka pihak lainnya berhak mengakhiri PERJANJIAN ini dengan pemberitahuan tertulis;</li><li value="4">Apabila <strong>PIHAK PERTAMA</strong> terbukti tidak memenuhi SLA minimum sebagaimana diatur dalam Lampiran SLA karena kesalahan atau kelalaian <strong>PIHAK PERTAMA</strong> dan kondisi tersebut terjadi secara berulang selama 3 (tiga) bulan berturut-turut, maka <strong>PIHAK KEDUA</strong> berhak memperoleh kompensasi sesuai Lampiran SLA. Apabila setelah diberikan 3 (tiga) teguran tertulis secara berturut-turut <strong>PIHAK PERTAMA</strong> tetap tidak melakukan perbaikan dalam jangka waktu yang wajar, <strong>PIHAK KEDUA</strong> berhak mengakhiri PERJANJIAN tanpa dikenakan penalti terminasi dini.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 11</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>KETENTUAN PERUBAHAN</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1">Selama masa berlakunya Perjanjian, salah satu pihak dapat mengajukan usulan perubahan Perjanjian dengan mengajukan usulan secara tertulis kepada pihak lainnya;</li><li value="2">Dalam jangka waktu 30 hari setelah menerima pemberitahuan tertulis mengenai usulan perubahan dari <strong>PIHAK KEDUA</strong>, <strong>PIHAK PERTAMA</strong> akan memberitahu <strong>PIHAK KEDUA</strong> apakah perubahan dapat dilaksanakan atau tidak. Apabila perubahan tersebut dapat dilaksanakan, maka <strong>PIHAK PERTAMA</strong> berhak mengajukan perubahan atas biaya Jasa dan ketentuan lainnya dari Perjanjian ini;</li><li value="3"><strong>PIHAK KEDUA</strong> dapat mengajukan usulan upgrade dan downgrade layanan selama masa berlakunya perjanjian melalui pemberitahuan tertulis 30 hari sebelumnya;</li><li value="4">Penurunan kapasitas / bandwidth / downgrade apabila ada kapasitas bandwidth / downgrade layanan sebelum berakhirnya masa berlangganan minimal 1 tahun akan dikenakan penalti dengan ketentuan sebagai berikut (100% X Biaya Bulanan X Bulan yang belum terpenuhi);</li><li value="5">Selama masa berlakunya Perjanjian ini <strong>Pihak Kedua</strong> tidak bisa mengajukan perubahan biaya layanan yang berjalan sampai dengan masa kontrak Perjanjian ini berakhir. Terkecuali adanya permohonan upgrade layanan;</li><li value="6">Apabila ada hal-hal  yang belum diatur dalam Kontrak ini. Maka hal-hal tersebut akan diatur dan ditetapkan kemudian secara tertulis tertuang dalam Amandemen dan atau Addendum dengan tetap memperhatikan ketentuan-ketentuan dan peraturan intern <strong>PIHAK PERTAMA</strong> dan hukum yang berlaku di Indonesia.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 12</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>KERAHASIAAN</strong></p>
<p><strong>Para Pihak</strong> sepakat bahwa seluruh isi Perjanjian ini harus diperlakukan secara rahasia. Oleh karena itu, <strong>Para Pihak</strong> sepakat untuk merahasiakan semua data, dokumen, catatan atau informasi yang diterima oleh salah satu Pihak dari Pihak lainnya sehubungan dengan pelaksanaan Perjanjian ini dan tidak akan diberitahukan kepada pihak ketiga tanpa terlebih dahulu mendapatkan persetujuan tertulis dari Pihak lainnya.</p>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 13</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>FORCE MAJEURE</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1">Keadaan Memaksa (Force Majeure) adalah setiap peristiwa di luar kendali dan kemampuan wajar <strong>PARA PIHAK</strong> yang secara langsung mengakibatkan sebagian atau seluruh kewajiban dalam Perjanjian ini tidak dapat dilaksanakan, termasuk namun tidak terbatas pada bencana alam, kebakaran, perang, kerusuhan, wabah penyakit, pemogokan, gangguan jaringan berskala besar, kegagalan sistem di luar kendali <strong>PARA PIHAK</strong>, kebijakan Pemerintah, atau peristiwa lain yang sejenis.</li><li value="2">PIHAK yang mengalami Keadaan Memaksa wajib memberitahukan secara tertulis kepada pihak lainnya paling lambat 14 (empat belas) Hari Kalender sejak diketahui atau seharusnya diketahui terjadinya Keadaan Memaksa, disertai penjelasan mengenai dampak terhadap pelaksanaan Perjanjian.</li><li value="3">Selama Keadaan Memaksa berlangsung, kewajiban <strong>PARA PIHAK</strong> yang terdampak ditangguhkan sepanjang tidak dapat dilaksanakan akibat Keadaan Memaksa. Penangguhan tersebut tidak menghapus kewajiban yang telah timbul sebelum terjadinya Keadaan Memaksa.</li><li value="4"><strong>PARA PIHAK</strong> wajib melakukan upaya yang wajar untuk mengurangi dampak Keadaan Memaksa dan melanjutkan pelaksanaan Perjanjian segera setelah keadaan tersebut berakhir.</li><li value="5">Apabila Keadaan Memaksa berlangsung lebih dari 90 (sembilan puluh) Hari Kalender secara berturut-turut dan <strong>PARA PIHAK</strong> tidak mencapai kesepakatan mengenai kelanjutan Perjanjian, masing-masing pihak berhak mengakhiri Perjanjian dengan pemberitahuan tertulis tanpa dikenakan penalti, dengan tetap menyelesaikan seluruh hak dan kewajiban yang telah timbul sebelum tanggal efektif pengakhiran.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 14</strong></p>
<p style="text-align:center; font-size:11pt; margin-top:0; margin-bottom:4pt;"><strong>PENYELESAIAN SENGKETA</strong></p>
<ol class="ct-list ql-liststyle-decimal" style="list-style-type:decimal; padding-left:18pt; margin:0;"><li value="1">Apabila timbul perselisihan, sengketa, atau perbedaan penafsiran yang berkaitan dengan pelaksanaan maupun pelanggaran atas PERJANJIAN ini, <strong>PARA PIHAK</strong> sepakat untuk terlebih dahulu menyelesaikannya secara musyawarah untuk mufakat;</li><li value="2">Pihak yang merasa dirugikan wajib menyampaikan pemberitahuan tertulis kepada pihak lainnya mengenai adanya sengketa dimaksud. Sejak diterimanya pemberitahuan tersebut, <strong>PARA PIHAK</strong> wajib melakukan musyawarah untuk mencapai penyelesaian dalam jangka waktu paling lama 30 (tiga puluh) hari kalender;</li><li value="3">Selama proses penyelesaian sengketa berlangsung, <strong>PARA PIHAK</strong> tetap berkewajiban melaksanakan ketentuan-ketentuan dalam PERJANJIAN ini sepanjang pelaksanaannya tidak berkaitan langsung dengan pokok sengketa yang sedang diperselisihkan;</li><li value="4">Apabila dalam jangka waktu sebagaimana dimaksud pada ayat (2) <strong>PARA PIHAK</strong> tidak berhasil mencapai kesepakatan, maka <strong>PARA PIHAK</strong> sepakat untuk menyelesaikan sengketa tersebut melalui jalur hukum pada Pengadilan Negeri Cirebon;</li><li value="5"><strong>PARA PIHAK</strong> dengan ini memilih domisili hukum yang tetap dan tidak berubah di wilayah hukum Pengadilan Negeri Cirebon untuk segala akibat hukum yang timbul dari pelaksanaan maupun penafsiran PERJANJIAN ini.</li></ol>
<p style="text-align:center; font-size:11pt; font-weight:bold; margin-top:16pt; margin-bottom:4pt;"><strong>PASAL 15</strong></p>
